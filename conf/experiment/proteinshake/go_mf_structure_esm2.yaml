# @package _global_
# Reproduces the printed Table 1 cell: BioBlobs on go_mf (structure split) with ESM2-T30.
defaults:
  - override /datasets: go_mf
  - override /encoders: esm2_static
  - override /partitioners: bioblobs
  - override /decoders: mil
  - override /tasks: multi_label
  - override /training: proteinshake

name: proteinshake/go_mf_structure_esm2
datasets:
  split: structure
partitioners:
  num_blobs: 20
  seed_radius: 12.0
  proximity_bias: 0.5
decoders:
  use_blob_interaction: false
training:
  lr: 0.001
  weight_decay: 0.0
  batch_size: 128
  epochs: 60
  warmup_epochs: 5
objective:
  hoyer_weight: 0.3
selection:
  metric: fmax
  patience: 15
  min_delta: 0.0

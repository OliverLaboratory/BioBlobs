# @package _global_
# Reproduces the printed Table 1 cell: BioBlobs with SaProt-650M on go_mf (structure split).
defaults:
  - override /datasets: go_mf
  - override /encoders: saprot_static
  - override /partitioners: bioblobs
  - override /decoders: mil
  - override /tasks: multi_label
  - override /training: proteinshake

name: proteinshake/go_mf_structure_saprot
datasets:
  split: structure
partitioners:
  num_blobs: 32
  seed_radius: 20.0
  proximity_bias: 0.5
decoders:
  use_blob_interaction: false
training:
  lr: 0.001
  weight_decay: 0.0
  batch_size: 128
  epochs: 60
  warmup_epochs: 5
objective:
  hoyer_weight: 0.0003
selection:
  metric: fmax
  patience: 15
  min_delta: 0.001

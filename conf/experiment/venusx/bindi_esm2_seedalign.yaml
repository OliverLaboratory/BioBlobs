# @package _global_
# Tables 2, 10, 11: BioBlobs with seed alignment (site-supervised) on VenusX BindI with ESM2-T30.
defaults:
  - override /datasets: venusx
  - override /encoders: esm2_static
  - override /partitioners: bioblobs
  - override /decoders: mil
  - override /training: venusx

name: venusx/bindi_esm2_seedalign
datasets:
  target: BindI
  site_supervised: true
partitioners:
  num_blobs: 20
  seed_radius: 12.0
  proximity_bias: 0.5
decoders:
  dropout: 0.1
  use_blob_interaction: false
training:
  lr: 0.0003
  weight_decay: 0.0001
  batch_size: 32
  epochs: 100
objective:
  hoyer_weight: 0
  seed_align_weight: 0.1
selection:
  metric: macro_f1
  patience: 30
  early_stop_any_of: [macro_f1, site_soft_recall, composite]

[project]
name = "bioblobs"
version = "0.0.0"
description = "BioBlobs: Unsupervised Discovery of Functional Substructures for Protein Function Prediction (anonymous code release)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    # Core PyTorch (CUDA 12.8 wheels via the explicit index below).
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",
    # PyTorch Geometric (the kernel extensions are pulled in via the
    # find-links entry below; declaring them here keeps them in the lock).
    "torch_geometric>=2.7,<3",
    "pyg_lib",
    "torch_scatter",
    "torch_cluster",
    "torch_sparse",
    "torch_spline_conv",
    # Training stack.
    "pytorch-lightning>=2.5,<3",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
    "wandb>=0.18,<1",
    "scikit-learn>=1.5,<2",
    "loguru>=0.7,<1",
    "tqdm>=4.66,<5",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    # PLM encoders + dataset adapters.
    "transformers>=4.45",
    "huggingface_hub>=0.26",
    "datasets>=3.0",
    "proteinshake>=0.3,<1",
    "biopandas>=0.5,<1",
]

[tool.uv]
# This is an application repo, not a library; do not install the local
# project itself, only its dependencies.
package = false

# CUDA 12.8 PyTorch wheels and the PyG kernel extensions are published only
# for Linux x86_64 / CPython. Restrict the resolver to that target so it
# doesn't fail on Windows / macOS / aarch64 / non-CPython splits.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and platform_python_implementation == 'CPython'",
]

# PyTorch CUDA 12.8 wheel index. ``explicit = true`` means uv only resolves
# packages listed in ``[tool.uv.sources]`` against this index, so the rest of
# the dependency tree still comes from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# PyTorch Geometric kernel-extension wheels for torch 2.7 + cu128 are
# published as a flat HTML index (the same one ``pip install -f`` consumes).
[[tool.uv.index]]
name = "pyg-cu128"
url = "https://data.pyg.org/whl/torch-2.7.0+cu128.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
pyg_lib = { index = "pyg-cu128" }
torch_scatter = { index = "pyg-cu128" }
torch_cluster = { index = "pyg-cu128" }
torch_sparse = { index = "pyg-cu128" }
torch_spline_conv = { index = "pyg-cu128" }
